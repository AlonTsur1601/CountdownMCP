name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify tag matches package version
        run: node -e "const p=require('./package.json'); if ('v'+p.version!==process.env.GITHUB_REF_NAME) { console.error('Tag must equal v'+p.version); process.exit(1) }"
      - name: Create source archive and checksum
        run: |
          git archive --format=zip --prefix="CountdownMCP-${GITHUB_REF_NAME}/" --output="CountdownMCP-${GITHUB_REF_NAME}.zip" HEAD
          sha256sum "CountdownMCP-${GITHUB_REF_NAME}.zip" > "CountdownMCP-${GITHUB_REF_NAME}.zip.sha256"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "CountdownMCP-${GITHUB_REF_NAME}.zip" "CountdownMCP-${GITHUB_REF_NAME}.zip.sha256" --verify-tag --generate-notes --title "CountdownMCP ${GITHUB_REF_NAME}"
